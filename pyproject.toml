[tool.poetry]
name = "config-file-manager"
version = "0.1.0"
description = "A beginner-friendly configuration file manager for JSON, CSV, and XML"
authors = ["Derick Dukundane <yvesderricks@gmail.com>"]
readme = "README.md"
packages = [{ include = "config_manager" }]

[tool.poetry.dependencies]
python = "^3.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
